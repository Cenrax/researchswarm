[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caid"
version = "0.1.0"
description = "CAID - Centralized Asynchronous Isolated Delegation framework for multi-agent software engineering"
readme = "USAGE.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "networkx>=3.1",
    "pydantic>=2.0",
    "litellm>=1.40",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
]

[project.scripts]
caid = "caid.cli:main"

[tool.setuptools.packages.find]
include = ["caid*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
